<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흑백 사진을 컬러로</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top"><a class="back" href="index.html" title="처음으로">←</a><h1>흑백 사진을 컬러로</h1></header>

<main class="page">
  <aside class="side">
    <section>
      <h2>사진</h2>
      <div id="picker"></div>
    </section>
    <section>
      <h2>조절</h2>
      <div class="ctrl">
        <label>색 진하기 <b id="satVal">1.0배</b></label>
        <input type="range" id="sat" min="0" max="2" step="0.1" value="1">
        <div class="ends"><span>흑백</span><span>진하게</span></div>
      </div>
    </section>
    <section class="about">
      <h2>이 기술은</h2>
      <div class="name">DeOldify</div>
      <span class="field">생성 AI · 흑백 사진 컬러화</span>
      <ul>
        <li>컬러 사진을 일부러 흑백으로 만든 뒤, <b>원래 색을 맞히도록</b> 수많은 사진(ImageNet 약 100만 장)으로 학습했어요.</li>
        <li>AI는 사진의 <b>밝기와 모양</b>만 보고 색을 상상해서 칠해요.</li>
        <li>하늘 · 나무 · 피부처럼 색이 거의 정해진 것은 잘 맞히지만, 옷이나 자동차처럼 색이 여러 가지인 물체는 실제와 다를 수 있어요.</li>
        <li>만든 사람: Jason Antic (2018)</li>
      </ul>
    </section>
  </aside>

  <section class="main">
    <div class="error" id="err"></div>
    <div class="stage" id="stage">
      <div class="status" id="status"></div>
      <div class="empty" id="empty">예제 사진을 눌러 시작하세요</div>
      <div id="out" hidden>
        <div id="cmp"></div>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="tabs" id="leftSel">
            <button class="on" data-k="gray" type="button">흑백</button>
            <button data-k="orig" type="button">원래 색</button>
          </div>
          <button class="btn ghost" id="save" type="button">결과 저장</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="lib/ort/ort.wasm.min.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  // DeOldify (artistic) : 흑백 사진 → 색 예측. 64MB 를 11MB 조각 6개로 나눠 둠 (GitHub 웹 업로드 제한)
  const MODEL = [0, 1, 2, 3, 4, 5].map((i) => "models/colorize/deoldify.part" + i);
  const $ = AI.$;
  $("#picker").innerHTML = AI.pickerHTML(` <a href="https://www.pexels.com/ko-kr/search/black%20and%20white/" target="_blank" rel="noopener">흑백 사진</a>`);
  const err = AI.errorBox($("#err"));
  const loader = AI.loader($("#stage"));
  const cmp = AI.compare($("#cmp"));
  let model = null, src = null, isColor = false, gray = null, L = null, A = null, B = null, out = null, left = "gray";

  async function getModel() {
    if (model) return model;
    loader.show("AI 모델 불러오는 중", "64MB · 처음 한 번만", 0);
    model = await AI.loadModel(MODEL, (p) => loader.progress(p));
    return model;
  }

  /* sRGB ↔ Lab */
  const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  const gam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
  const fx = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
  const fi = (t) => (t > 0.206893 ? t * t * t : (t - 16 / 116) / 7.787);
  function rgb2lab(r, g, b) {
    r = lin(r / 255); g = lin(g / 255); b = lin(b / 255);
    const X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047, Y = 0.2126 * r + 0.7152 * g + 0.0722 * b, Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
    const x = fx(X), y = fx(Y), z = fx(Z);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }
  function lab2rgb(l, a, b) {
    const y = (l + 16) / 116, x = y + a / 500, z = y - b / 200;
    const X = fi(x) * 0.95047, Y = fi(y), Z = fi(z) * 1.08883;
    const r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z, g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z, bb = 0.0557 * X - 0.204 * Y + 1.057 * Z;
    return [gam(r), gam(g), gam(bb)].map((v) => Math.max(0, Math.min(255, Math.round(v * 255))));
  }

  async function run() {
    if (!src) return;
    err.hide();
    try {
      const m = await getModel();
      const w = src.width, h = src.height, n = w * h;
      const px = src.getContext("2d").getImageData(0, 0, w, h).data;
      // 컬러 사진인지 확인 → 흑백 만들기
      let diff = 0;
      for (let i = 0; i < px.length; i += 16) diff += Math.abs(px[i] - px[i + 1]) + Math.abs(px[i + 1] - px[i + 2]);
      isColor = diff / (px.length / 16) > 6;
      gray = document.createElement("canvas"); gray.width = w; gray.height = h;
      const gg = gray.getContext("2d"), gi = gg.createImageData(w, h);
      L = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const v = Math.round(0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]);
        gi.data[i * 4] = gi.data[i * 4 + 1] = gi.data[i * 4 + 2] = v; gi.data[i * 4 + 3] = 255;
        L[i] = rgb2lab(v, v, v)[0];
      }
      gg.putImageData(gi, 0, 0);
      // AI 에 넣기 (정사각형으로 줄인 흑백, 0~255)
      const S = 256;
      const sq = document.createElement("canvas"); sq.width = S; sq.height = S;
      const sg = sq.getContext("2d", { willReadFrequently: true }); sg.imageSmoothingQuality = "high";
      sg.drawImage(gray, 0, 0, S, S);
      const sp = sg.getImageData(0, 0, S, S).data, x = new Float32Array(3 * S * S);
      for (let i = 0; i < S * S; i++) x[i] = x[S * S + i] = x[2 * S * S + i] = sp[i * 4];
      loader.show("AI가 색을 칠하는 중", `${S}×${S}`);
      await AI.nextFrame(); await AI.sleep(30);
      const t0 = performance.now();
      const feeds = {}; feeds[m.inputNames[0]] = new ort.Tensor("float32", x, [1, 3, S, S]);
      const y = (await m.run(feeds))[m.outputNames[0]].data;
      const ms = performance.now() - t0;
      // 결과(정사각형) → 원래 크기로 늘려서 색(a, b)만 가져오기
      const oc = document.createElement("canvas"); oc.width = S; oc.height = S;
      const og = oc.getContext("2d"), oi = og.createImageData(S, S);
      for (let i = 0; i < S * S; i++) {
        for (let k = 0; k < 3; k++) oi.data[i * 4 + k] = Math.max(0, Math.min(255, y[k * S * S + i]));
        oi.data[i * 4 + 3] = 255;
      }
      og.putImageData(oi, 0, 0);
      const big = document.createElement("canvas"); big.width = w; big.height = h;
      const bg = big.getContext("2d", { willReadFrequently: true }); bg.imageSmoothingQuality = "high";
      bg.drawImage(oc, 0, 0, w, h);
      const bp = bg.getImageData(0, 0, w, h).data;
      A = new Float32Array(n); B = new Float32Array(n);
      for (let i = 0; i < n; i++) { const lab = rgb2lab(bp[i * 4], bp[i * 4 + 1], bp[i * 4 + 2]); A[i] = lab[1]; B[i] = lab[2]; }
      loader.hide();
      compose();
      $("#leftSel").hidden = !isColor;
      if (!isColor) left = "gray";
      $("#status").innerHTML = `<span class="pill accent">${isColor ? "컬러 사진 → 흑백 → AI 색칠" : "흑백 사진 → AI 색칠"}</span><span class="pill">${(ms / 1000).toFixed(1)}초</span>`;
      $("#empty").hidden = true; $("#out").hidden = false;
      show();
    } catch (e) {
      console.error(e); loader.hide();
      err.show("실행 중 문제가 생겼어요: " + (e.message || e));
    }
  }

  // 밝기(L)는 원래 사진 그대로, 색(a, b)만 AI 의 것 사용
  function compose() {
    const w = src.width, h = src.height, k = +$("#sat").value;
    out = document.createElement("canvas"); out.width = w; out.height = h;
    const g = out.getContext("2d"), im = g.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      const [r, gg, b] = lab2rgb(L[i], A[i] * k, B[i] * k);
      im.data[i * 4] = r; im.data[i * 4 + 1] = gg; im.data[i * 4 + 2] = b; im.data[i * 4 + 3] = 255;
    }
    g.putImageData(im, 0, 0);
  }
  const show = () => out && cmp.set(left === "orig" ? src : gray, out, left === "orig" ? "원래 색" : "흑백", "AI 색칠");

  AI.$$("#leftSel button").forEach((b) => b.addEventListener("click", () => {
    AI.$$("#leftSel button").forEach((x) => x.classList.toggle("on", x === b));
    left = b.dataset.k; show();
  }));
  $("#sat").addEventListener("input", () => { $("#satVal").textContent = (+$("#sat").value).toFixed(1) + "배"; if (A) { compose(); show(); } });
  $("#save").addEventListener("click", () => out && AI.download(out, "AI_컬러.png"));
  window.addEventListener("resize", show);

  AI.setupPicker({
    drop: $("#drop"), samplesEl: $("#samples"), maxSide: 1024,
    samples: [
      { src: "assets/samples/colorize/street1910.jpg", label: "가로수 길 (1900년대)" },
      { src: "assets/samples/colorize/city1915.jpg", label: "디트로이트 시내 (1915년)" },
      { src: "assets/samples/colorize/trumpet1946.jpg", label: "루이 암스트롱 (1946년)" },
      { src: "assets/samples/colorize/friends1919.jpg", label: "헬렌 켈러와 찰리 채플린 (1919년)" },
    ],
    onImage: async (c) => {
      src = c; left = "gray";
      AI.$$("#leftSel button").forEach((x) => x.classList.toggle("on", x.dataset.k === "gray"));
      await run();
    },
    onError: (m) => err.show(m),
  });
})();
</script>
</body>
</html>
