<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진을 만화로</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top"><a class="back" href="index.html" title="처음으로">←</a><h1>사진을 만화로</h1></header>

<main class="page">
  <aside class="side">
    <section>
      <h2>그림체</h2>
      <div class="tabs" id="styleSel">
        <button class="on" data-s="face" type="button">인물 만화</button>
        <button data-s="scene" type="button">애니메이션 배경</button>
      </div>
    </section>
    <section>
      <h2>사진</h2>
      <div id="picker"></div>
      <p class="small" style="margin:10px 0 0">인물 만화는 얼굴이 크게 나온 사진일수록 잘 돼요.</p>
    </section>
    <section>
      <h2>조절</h2>
      <div class="ctrl">
        <label>처리 크기 (긴 쪽) <b id="sizeVal">512</b></label>
        <input type="range" id="size" min="256" max="768" step="64" value="512">
        <div class="ends"><span>빠름</span><span>자세히 (느림)</span></div>
      </div>
    </section>
    <section class="todo">
      <h2>해 볼 것</h2>
      <ol>
        <li><span>기본</span>인물 사진을 만화로 바꿔 보기</li>
        <li><span>응용</span>같은 사진을 두 그림체로 바꿔 비교하기</li>
        <li><span>심화</span>잘 바뀌는 사진과 이상하게 바뀌는 사진의 차이 찾기</li>
      </ol>
    </section>
  </aside>

  <section class="main">
    <div class="error" id="err"></div>
    <div class="stage" id="stage">
      <div class="status" id="status"></div>
      <div class="empty" id="empty">예제 사진을 눌러 시작하세요</div>
      <div id="out" hidden>
        <div id="cmp"></div>
        <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" id="save" type="button">결과 저장</button></div>
      </div>
    </div>
  </section>
</main>

<script src="lib/ort/ort.wasm.min.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  // AnimeGANv2 (사진 → 만화 그림체로 바꾸는 생성 AI)
  const MODELS = { face: "models/cartoon_face.onnx", scene: "models/cartoon_scene.onnx" };
  const NAMES = { face: "인물 만화", scene: "애니메이션 배경" };
  const $ = AI.$;
  $("#picker").innerHTML = AI.pickerHTML();
  const err = AI.errorBox($("#err"));
  const loader = AI.loader($("#stage"));
  const cmp = AI.compare($("#cmp"));
  let style = "face", src = null, input = null, out = null;

  async function run() {
    if (!src) return;
    err.hide();
    try {
      const url = MODELS[style];
      loader.show("AI 모델 불러오는 중", "9MB", 0);
      const m = await AI.loadModel(url, (p) => loader.progress(p));
      // 긴 쪽을 정한 크기로, 가로 · 세로는 8의 배수로
      const L = +$("#size").value, r = Math.min(1, L / Math.max(src.width, src.height));
      const w = Math.max(64, Math.round((src.width * r) / 8) * 8), h = Math.max(64, Math.round((src.height * r) / 8) * 8);
      input = document.createElement("canvas"); input.width = w; input.height = h;
      const ig = input.getContext("2d", { willReadFrequently: true }); ig.imageSmoothingQuality = "high";
      ig.drawImage(src, 0, 0, w, h);
      const px = ig.getImageData(0, 0, w, h).data, n = w * h, x = new Float32Array(3 * n);
      for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) x[k * n + i] = px[i * 4 + k] / 127.5 - 1;
      loader.show("만화로 바꾸는 중", `${w}×${h}`);
      await AI.nextFrame(); await AI.sleep(30);
      const t0 = performance.now();
      const feeds = {}; feeds[m.inputNames[0]] = new ort.Tensor("float32", x, [1, 3, h, w]);
      const res = (await m.run(feeds))[m.outputNames[0]];
      const ms = performance.now() - t0;
      const [, , H, W] = res.dims, N = W * H, y = res.data;
      out = document.createElement("canvas"); out.width = W; out.height = H;
      const og = out.getContext("2d"), oi = og.createImageData(W, H);
      for (let i = 0; i < N; i++) {
        for (let k = 0; k < 3; k++) oi.data[i * 4 + k] = Math.max(0, Math.min(255, Math.round((y[k * N + i] + 1) * 127.5)));
        oi.data[i * 4 + 3] = 255;
      }
      og.putImageData(oi, 0, 0);
      loader.hide();
      $("#empty").hidden = true; $("#out").hidden = false;
      cmp.set(input, out, "원본", NAMES[style]);
      $("#status").innerHTML = `<span class="pill accent">${NAMES[style]}</span><span class="pill">${(ms / 1000).toFixed(1)}초</span>`;
    } catch (e) {
      console.error(e); loader.hide();
      err.show("실행 중 문제가 생겼어요: " + (e.message || e));
    }
  }

  AI.$$("#styleSel button").forEach((b) => b.addEventListener("click", () => {
    AI.$$("#styleSel button").forEach((x) => x.classList.toggle("on", x === b));
    style = b.dataset.s; run();
  }));
  let t = null;
  $("#size").addEventListener("input", () => { $("#sizeVal").textContent = $("#size").value; clearTimeout(t); t = setTimeout(run, 400); });
  $("#save").addEventListener("click", () => out && AI.download(out, "AI_만화.png"));
  window.addEventListener("resize", () => out && cmp.set(input, out, "원본", NAMES[style]));

  AI.setupPicker({
    drop: $("#drop"), samplesEl: $("#samples"), maxSide: 1280,
    samples: [
      { src: "assets/samples/portrait.jpg", label: "인물 (얼굴)" },
      { src: "assets/samples/bus.jpg", label: "거리" },
      { src: "assets/samples/coffee.jpg", label: "커피잔" },
      { src: "assets/samples/cat.jpg", label: "고양이" },
    ],
    onImage: async (c) => { src = c; await run(); },
    onError: (m) => err.show(m),
  });
})();
</script>
</body>
</html>
