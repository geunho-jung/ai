<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흐린 사진 선명하게</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top"><a class="back" href="index.html" title="처음으로">←</a><h1>흐린 사진 선명하게</h1></header>

<main class="page">
  <aside class="side">
    <section>
      <h2>사진</h2>
      <div id="picker"></div>
    </section>
    <section>
      <h2>작고 흐리게 만들기</h2>
      <div class="ctrl">
        <label>줄일 크기 (긴 쪽) <b id="sizeVal">120px</b></label>
        <input type="range" id="size" min="48" max="200" step="8" value="120">
      </div>
      <div class="ctrl">
        <label>사진 깨짐 (JPEG) <b id="qVal">없음</b></label>
        <input type="range" id="q" min="5" max="100" step="5" value="100">
        <div class="ends"><span>많이 깨짐</span><span>없음</span></div>
      </div>
      <button class="btn block" id="go" type="button" style="margin-top:14px" disabled>4배로 키우기</button>
    </section>
    <section class="todo">
      <h2>해 볼 것</h2>
      <ol>
        <li><span>기본</span>가운데 막대를 끌어 단순 확대와 AI 확대 비교하기</li>
        <li><span>응용</span>사진 깨짐을 많이 넣고 AI가 얼마나 깨끗하게 만드는지 보기</li>
        <li><span>심화</span>원본과 비교해 AI가 없던 무늬를 지어낸 곳 찾기</li>
      </ol>
    </section>
  </aside>

  <section class="main">
    <div class="error" id="err"></div>
    <div class="stage" id="stage">
      <div class="status" id="status"></div>
      <div class="empty" id="empty">예제 사진을 눌러 시작하세요</div>
      <div id="out" hidden>
        <div id="cmp"></div>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <div class="tabs" id="leftSel">
            <button class="on" data-k="bicubic" type="button">단순 확대</button>
            <button data-k="nearest" type="button">픽셀 그대로</button>
            <button data-k="orig" type="button">원본</button>
          </div>
          <span class="small" id="smallInfo"></span>
        </div>
      </div>
    </div>
    <div class="card" id="scorePanel" hidden>
      <h3>원본과 얼마나 같을까? (PSNR, 클수록 원본에 가까움)</h3>
      <table class="list"><tbody id="score"></tbody></table>
      <p class="small" style="margin:10px 0 0">AI 확대가 더 선명해 보여도 점수는 낮을 수 있어요. 원본에 없던 디테일을 그럴듯하게 그려 넣기 때문이에요.</p>
    </div>
  </section>
</main>

<script src="lib/ort/ort.wasm.min.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const MODEL = "models/realesr-general-x4v3.onnx";
  const $ = AI.$;
  $("#picker").innerHTML = AI.pickerHTML();
  const err = AI.errorBox($("#err"));
  const loader = AI.loader($("#stage"));
  const cmp = AI.compare($("#cmp"));
  let model = null, src = null, R = {}, left = "bicubic";

  async function getModel() {
    if (model) return model;
    loader.show("AI 모델 불러오는 중", "5MB", 0);
    model = await AI.loadModel(MODEL, (p) => loader.progress(p));
    return model;
  }
  function resize(c, w, h, smooth = true) {
    const o = document.createElement("canvas"); o.width = w; o.height = h;
    const g = o.getContext("2d"); g.imageSmoothingEnabled = smooth; g.imageSmoothingQuality = "high";
    g.drawImage(c, 0, 0, w, h);
    return o;
  }
  const jpeg = (c, q) => new Promise((res) => c.toBlob(async (b) => res(await AI.blobToCanvas(b, 4096)), "image/jpeg", q));

  async function esrgan(m, c) {
    const w = c.width, h = c.height, n = w * h;
    const px = c.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
    const x = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) { x[i] = px[i * 4] / 255; x[n + i] = px[i * 4 + 1] / 255; x[2 * n + i] = px[i * 4 + 2] / 255; }
    const feeds = {}; feeds[m.inputNames[0]] = new ort.Tensor("float32", x, [1, 3, h, w]);
    const out = (await m.run(feeds))[m.outputNames[0]];
    const [, , H, W] = out.dims, N = W * H, y = out.data;
    const o = document.createElement("canvas"); o.width = W; o.height = H;
    const g = o.getContext("2d"), im = g.createImageData(W, H);
    for (let i = 0; i < N; i++) {
      for (let k = 0; k < 3; k++) im.data[i * 4 + k] = Math.max(0, Math.min(255, Math.round(y[k * N + i] * 255)));
      im.data[i * 4 + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    return o;
  }
  function psnr(a, b) {
    const w = a.width, h = a.height;
    const A = a.getContext("2d").getImageData(0, 0, w, h).data, B = b.getContext("2d").getImageData(0, 0, w, h).data;
    let s = 0;
    for (let i = 0; i < A.length; i += 4) for (let k = 0; k < 3; k++) { const d = A[i + k] - B[i + k]; s += d * d; }
    const mse = s / (w * h * 3);
    return mse === 0 ? 99 : 10 * Math.log10((255 * 255) / mse);
  }

  async function run() {
    if (!src) return;
    err.hide();
    try {
      const m = await getModel();
      const L = +$("#size").value, q = +$("#q").value;
      const r = Math.min(1, L / Math.max(src.width, src.height));
      const sw = Math.max(8, Math.round(src.width * r)), sh = Math.max(8, Math.round(src.height * r));
      let small = resize(src, sw, sh);
      if (q < 100) small = await jpeg(small, q / 100);
      const W = sw * 4, H = sh * 4;
      R = { small, orig: resize(src, W, H), nearest: resize(small, W, H, false), bicubic: resize(small, W, H, true) };
      loader.show("AI가 사진을 키우는 중", `${sw}×${sh} → ${W}×${H}`);
      await AI.nextFrame(); await AI.sleep(30);
      const t0 = performance.now();
      R.ai = await esrgan(m, small);
      const ms = performance.now() - t0;
      loader.hide();
      $("#empty").hidden = true; $("#out").hidden = false;
      show();
      $("#status").innerHTML = `<span class="pill accent">${sw}×${sh} → ${W}×${H}</span><span class="pill">${(ms / 1000).toFixed(1)}초</span>`;
      $("#smallInfo").textContent = `AI에 넣은 사진: ${sw}×${sh}`;
      $("#score").innerHTML = [["픽셀 그대로", R.nearest], ["단순 확대", R.bicubic], ["AI 확대", R.ai]]
        .map(([a, c]) => `<tr><td><b>${a}</b></td><td>${psnr(R.orig, c).toFixed(1)} dB</td></tr>`).join("");
      $("#scorePanel").hidden = false;
    } catch (e) {
      console.error(e); loader.hide();
      err.show("실행 중 문제가 생겼어요: " + (e.message || e));
    }
  }
  const NAMES = { bicubic: "단순 확대", nearest: "픽셀 그대로", orig: "원본" };
  const show = () => R.ai && cmp.set(R[left], R.ai, NAMES[left], "AI 확대");
  AI.$$("#leftSel button").forEach((b) => b.addEventListener("click", () => {
    AI.$$("#leftSel button").forEach((x) => x.classList.toggle("on", x === b));
    left = b.dataset.k; show();
  }));
  $("#size").addEventListener("input", () => ($("#sizeVal").textContent = $("#size").value + "px"));
  $("#q").addEventListener("input", () => ($("#qVal").textContent = +$("#q").value === 100 ? "없음" : `품질 ${$("#q").value}`));
  $("#go").addEventListener("click", run);
  window.addEventListener("resize", show);

  AI.setupPicker({
    drop: $("#drop"), samplesEl: $("#samples"), maxSide: 1200,
    samples: [
      { src: "assets/samples/astronaut.jpg", label: "우주비행사" },
      { src: "assets/samples/cat.jpg", label: "고양이" },
      { src: "assets/samples/coffee.jpg", label: "커피잔" },
      { src: "assets/samples/sign.png", label: "표지판 (글자)" },
    ],
    onImage: async (c) => { src = c; $("#go").disabled = false; await run(); },
    onError: (m) => err.show(m),
  });
})();
</script>
</body>
</html>
